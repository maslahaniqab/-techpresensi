{% extends "base.html" %}
{% block title %}Laporan Pekerjaan{% endblock %}
{% block content %}
<h3 class="mb-3">Laporan Pekerjaan</h3>

<div class="card p-4 mb-3" style="max-width: 560px;">
  <form method="post">
    <div class="mb-3">
      <label class="form-label">Tanggal</label>
      <input type="date" name="tanggal" class="form-control" value="{{ tanggal_default }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Isi Laporan</label>
      <textarea name="isi_laporan" class="form-control" rows="5" placeholder="Ceritakan pekerjaan yang sudah Anda kerjakan hari ini" required></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Kirim Laporan</button>
  </form>
</div>

<div class="card p-3">
  <h6 class="mb-3">Riwayat Laporan Saya</h6>
  <div class="table-responsive">
    <table class="table table-hover align-middle mb-0">
      <thead>
        <tr>
          <th style="width:130px;">Tanggal</th>
          <th>Isi Laporan</th>
        </tr>
      </thead>
      <tbody>
        {% for l in riwayat %}
        <tr>
          <td>{{ l.tanggal.strftime('%d-%m-%Y') }}</td>
          <td style="white-space: pre-wrap;">{{ l.isi_laporan }}</td>
        </tr>
        {% else %}
        <tr><td colspan="2" class="text-center text-muted py-4">Belum ada laporan.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
